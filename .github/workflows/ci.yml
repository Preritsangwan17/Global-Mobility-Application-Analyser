name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
